<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Khybrio | Your business, always connected</title>
    <meta
      name="description"
      content="Get found, get booked, get ahead. Websites, Google and Facebook presence, booking systems and monthly care for small businesses in the Philippines. Fixed price, quoted on a free call."
    />
    <meta name="theme-color" content="#1C4D4A" />

    <!-- %BASE_URL% expands to '/' in dev and '/Khybrio/' in the Pages build,
         so these resolve correctly under the repo subpath. -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khybrio | Your business, always connected" />
    <meta
      property="og:description"
      content="Get found, get booked, get ahead. A studio in Zamboanga City: quoted on a free call, fixed price in writing, everything set up in your name."
    />
    <!-- A purpose-built 1200x630 JPEG (~70KB), not the 4MB hero PNG this used
         to point at. Messenger and Viber time out fetching a file that size
         and show no preview at all. JPEG on purpose, not WebP: link scrapers still handle WebP inconsistently. -->
    <meta property="og:image" content="%BASE_URL%assets/brand/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Khybrio island, home of Khybi the mascot" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
