<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Khybrio — Get found. Get trusted. In one bundle.</title>
    <meta
      name="description"
      content="Khybrio builds local businesses in Zamboanga City a professional website, an NFC tap card, and an optimized Google Business Profile and Facebook Page — as one bundle."
    />
    <meta name="theme-color" content="#1C4D4A" />

    <!-- %BASE_URL% expands to '/' in dev and '/Khybrio/' in the Pages build,
         so these resolve correctly under the repo subpath. -->
    <!-- Start the hero image downloading before the JS bundle even parses, so
         the first island frame paints as fast as possible. -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%assets/world/01-hero.webp"
      fetchpriority="high"
    />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khybrio — Get found. Get trusted. In one bundle." />
    <meta
      property="og:description"
      content="Website, NFC tap card and local presence for businesses in Zamboanga City. One bundle, one setup."
    />
    <!-- PNG on purpose, not the .webp the browser preloads above: link
         scrapers (LinkedIn, Viber, some Messenger clients) still handle WebP
         inconsistently. TODO: this file is ~4MB — export a 1200x630 crop under
         300KB so previews aren't slow to appear. -->
    <meta property="og:image" content="%BASE_URL%assets/world/01-hero.png" />
    <meta property="og:image:width" content="2752" />
    <meta property="og:image:height" content="1536" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
