<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Khybrio — We automate the work that eats your week</title>
    <meta
      name="description"
      content="We find the repetitive work in your business — the copy-pasting, re-typing and chasing — and make it run itself. Fixed price, documented, handed over in your name."
    />
    <meta name="theme-color" content="#1C4D4A" />

    <!-- %BASE_URL% expands to '/' in dev and '/Khybrio/' in the Pages build,
         so these resolve correctly under the repo subpath. -->
    <!-- The hero is the run log now, not an image — but the island still opens
         the flight a screen further down, so it is still worth an early fetch.
         Low priority on purpose: the run log must paint first. -->
    <link rel="preload" as="image" href="%BASE_URL%assets/world/01-hero.webp" />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <!-- The Philippine offering is a separate page in pesos. Overseas visitors
         should not be routed there, but search engines should know it exists. -->
    <link rel="alternate" hreflang="en-PH" href="%BASE_URL%ph/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khybrio — We automate the work that eats your week" />
    <meta
      property="og:description"
      content="Your team is doing a computer's job. We find the repetitive work, make it run itself, and hand it over documented and in your name."
    />
    <!-- A purpose-built 1200x630 JPEG (~70KB), not the 4MB hero PNG this used
         to point at — Messenger and Viber time out fetching a file that size
         and show no preview at all. JPEG on purpose, not the .webp the browser
         preloads above: link scrapers still handle WebP inconsistently. -->
    <meta property="og:image" content="%BASE_URL%assets/brand/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Khybrio island — the work running by itself" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
