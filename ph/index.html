<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Khybrio — Makikita ka na sa Google Maps</title>
    <meta
      name="description"
      content="Google Business Profile, reviews, website at automation para sa mga negosyo sa Zamboanga City. Libreng 15-minutong check ng listing mo."
    />
    <meta name="theme-color" content="#1C4D4A" />

    <!-- %BASE_URL% expands to '/' in dev and '/Khybrio/' in the Pages build.
         This page sits one level down, so asset paths still resolve off the
         base rather than off './'. -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%assets/world/01-hero.webp"
      fetchpriority="high"
    />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <link rel="alternate" hreflang="en" href="%BASE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khybrio — Makikita ka na sa Google Maps" />
    <meta
      property="og:description"
      content="Hinahanap ka nila sa Google Maps at wala ka doon. Inaayos namin ang listing mo, kinukuha ang reviews, at ginagawang mabilis ang website mo."
    />
    <meta property="og:image" content="%BASE_URL%assets/brand/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khybrio — Google, reviews at website para sa negosyo mo" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ph.jsx"></script>
  </body>
</html>
